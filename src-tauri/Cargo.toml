[package]
name = "astryx"
version = "1.96.4"
description = "Astrophotography planning and imaging session analysis"
authors = ["sparsile"]
license = "MIT"
repository = "https://github.com/sparsileg/astryx"
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
dirs-next = "2"
log = "0.4"
once_cell = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
zip = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# Issue #301: the can't-start dialog, shown before Tauri runs; the same
# backend tauri-plugin-dialog uses
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
clap = { version = "4", features = ["derive"] }

# Issue #292: attach to the console a command-line run was started from
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
